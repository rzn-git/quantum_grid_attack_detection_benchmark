# Curated rows of the arXiv appendix table "Further controls" (experiments/build_further_controls.py
# reads every value from its run artifact and fails loud on a missing run, file or key).
#
# A row: `check` (what was asked, with the scope a reader needs: attack, sample, seeds), `reading`
# (LaTeX; <0>, <1>, ... are replaced by the formatted values), `bears_on` (the body section the
# reading scopes), `values` and optional `require` (keys that must be true, or the build fails).
# A value: run, file, key, fmt, expect.
#   key     a "/"-separated JSON path (list indices as integers; a difference of two paths as
#           "a - b"). A "*" step iterates a list or dict and needs one of:
#             agg: min | max | one   ("one" fails unless exactly one entry is left)
#             pick_by: <path>        (the entry with the largest value at <path>, read at the key)
#           `where` / `where_not` keep the list entries whose fields match; `keys` names the
#           entries of a dict to iterate (a missing one fails).
#   fmt     a Python format spec; "count" for an integer with IEEE thousands spacing; a spec ending
#           in "%" prints a percentage.
#   sign    negative | positive: the wording assumes this sign ("loses 0.065"); the build checks
#           it and prints the magnitude.
#   expect  the text the value must print as. The build fails when the artifact disagrees, so a
#           wrong key or a changed run cannot put a different number in the table unseen.
# Group meanings are the color language (qgridbench.eval.design_tokens.MEANING).
# Sources: coverage audit 2026-11-19 (reports/coverage_audit_20261119/, with its review), decision
# log entries named per row.

