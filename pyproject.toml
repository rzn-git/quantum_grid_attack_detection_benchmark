[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qgridbench"
version = "0.1.0"
description = "QuantumGridBench: hybrid quantum-classical ML benchmark for cyberattack detection on public power system attack data"
authors = [{ name = "Md Rezwanul Islam", email = "rznislam@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
